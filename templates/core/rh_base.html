{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Vigent{% endblock %} - Vigent</title>
<link rel="stylesheet" href="{% static 'css/rh.css' %}">
<link rel="stylesheet" href="{% static 'css/cabecalho.css' %}">
</head>
<body>
<div class="app">

  {% include "_cabecalho.html" %}

  {% for m in messages %}
    <div class="aviso aviso-{{ m.tags|default:'info' }}">{{ m }}</div>
  {% endfor %}

  {% block conteudo %}{% endblock %}

  <div style="text-align: center; margin-top: 32px; padding-bottom: 20px;">
    <a href="{% url 'contas:politica_privacidade' %}" target="_blank" style="font-size: 12.5px; color: #8a94a6;">Política de Privacidade</a>
  </div>

</div>
</body>
</html>

{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigent - Esqueci minha senha</title>
<link rel="stylesheet" href="{% static 'css/vigent.css' %}">
</head>
<body>

  <div class="logo">VIGENT<span class="dot">.</span></div>

  <div class="card">
    <h1>Esqueci minha senha</h1>
    <p class="subtitle">Informe seu e-mail corporativo. Se ele estiver cadastrado, enviaremos um código de redefinição.</p>

    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="email">E-mail corporativo</label>
        <input type="email" id="email" name="email" placeholder="nome.sobrenome@nortex.com.br" required autofocus>
      </div>
      <button type="submit">Enviar código</button>
    </form>

    <a class="link-out" href="{% url 'contas:login' %}">Voltar ao login</a>
  </div>

</body>
</html>
